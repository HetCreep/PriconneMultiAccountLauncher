[tool.ruff]
target-version = "py310"
line-length = 180

[tool.ruff.lint]
# Base = ruff's default rule set (~416 rules across E/F/UP/TRY/LOG/BLE/SIM/I/RUF/C4/PL/PIE/...).
# The codebase had never been linted, so the first CI run surfaced 150 findings.
# Nothing is ignored to hide a bug: each entry below is either mechanical and
# waiting on one `ruff check --fix` run, or a real defect already tracked in the
# audit backlog. Delete an entry the moment its findings are gone — that is the
# whole point of listing them individually instead of narrowing `select`.
#
# NOTE: the base set is ruff's *default*, which widens between releases. A ruff
# bump can therefore turn CI red on rules nobody chose. When that happens, triage
# the new codes here rather than pinning ruff forever.
ignore = [
    # --- Mechanical. One `ruff check --fix` clears all of these. ---
    "UP006",   # 2  · use `list` not `List`
    "UP007",   # 4  · use `X | Y` for unions
    "UP034",   # 1  · extraneous parentheses
    "UP035",   # 10 · deprecated `typing` imports
    "UP045",   # 42 · use `X | None` instead of `Optional[X]`
    "I001",    # 6  · import block un-sorted
    "C419",    # 3  · unnecessary comprehension inside any()/all()
    "SIM102",  # 1  · collapsible nested `if`
    "SIM118",  # 3  · `key in dict` instead of `key in dict.keys()`
    "RUF015",  # 2  · prefer next(iter(x)) over list(x)[0]
    "RUF059",  # 1  · unused unpacked variable
    "PLR0402", # 1  · `import x.y as y` → `from x import y`
    "PIE794",  # 1  · duplicate class field definition

    # --- Real defects, already tracked. Fixing the code removes the ignore. ---
    "TRY002",  # 31 · bare `raise Exception(...)`. Includes launch.py raising
               #      Exception(res["error"]), which puts raw DMM server text in a
               #      user-facing dialog — audit finding F73. Needs a project
               #      exception hierarchy; see python/tkinter-desktop.md Error Surface.
    "LOG015",  # 17 · `logging.debug()` on the ROOT logger — the startup dump of
               #      config/device/env objects, audit finding F81. Fixed by using a
               #      module logger and not dumping whole objects.
    "BLE001",  # 12 · blind `except Exception`. Some are deliberate and carry a
               #      reasoned `# noqa: BLE001`; the rest are the silent-failure
               #      class from the audit and need narrowing.
    "TRY201",  # 2  · `raise` instead of `raise e`
    "TRY203",  # 1  · handler that immediately re-raises
    "TRY401",  # 1  · redundant exception object in logging.exception()
    "RUF012",  # 5  · mutable class attribute should be ClassVar
    "PLC0206", # 1  · dict iterated without .items()
]

[tool.ruff.lint.per-file-ignores]
# Pre-emptive: neither E402 nor T201 is in ruff's current default set, so these are
# inert today. They are declared so that enabling those rules — or a ruff release
# adding them to the default — does not break two things that are correct as written.
#
# The test inserts the package dir on sys.path before importing it, so its imports
# cannot be at the top of the file.
"test/**" = ["E402"]
# tools/ are one-shot scripts; printing is their user interface.
"tools/**" = ["T201"]
